name: Android

# The Android app is built HERE, never on a Windows dev box — a local Gradle
# run drags the whole machine down, so CI is the only build surface.
#
# The flow is the same shape as the extension's release workflow:
#   build + unit tests -> assemble the signed release APK -> publish it as a
#   GitHub release asset -> write the update manifest the app reads at
#   /api/app-release.
#
# The manifest's minSupportedVersionCode is CARRIED OVER from the previous
# manifest, never derived from the build being published — the floor is only
# raised by an explicit edit.

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + test the Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.IMGVAULT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::IMGVAULT_KEYSTORE_BASE64 is not set - the release APK cannot be signed."
            echo "Add the base64 of the PKCS#12 keystore as a repository secret and push again."
            exit 1
          fi
          mkdir -p android/.keystore
          # the secret is base64; strip any whitespace a copy/paste may have
          # left in it, otherwise base64 refuses the input
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/.keystore/upload.p12
          chmod 600 android/.keystore/upload.p12
          echo "keystore restored: $(stat -c%s android/.keystore/upload.p12) bytes"

      - name: Unit tests
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build the signed release APK
        working-directory: android
        env:
          IMGVAULT_KEYSTORE_PATH: ${{ github.workspace }}/android/.keystore/upload.p12
          IMGVAULT_KEY_ALIAS: ${{ secrets.IMGVAULT_KEY_ALIAS }}
          IMGVAULT_KEY_PASSWORD: ${{ secrets.IMGVAULT_KEY_PASSWORD }}
          IMGVAULT_STORE_PASSWORD: ${{ secrets.IMGVAULT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          # ONLY the signed APK counts. `assembleRelease` also leaves an
          # app-release-unsigned.apk behind when the signing config did not
          # apply, and publishing that would ship an APK no phone can update.
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::no SIGNED release APK was produced (app-release.apk is missing)." >&2
            echo "The keystore secret did not reach the build - nothing was published." >&2
            exit 1
          fi
          echo "signed apk: app/build/outputs/apk/release/app-release.apk"

      - name: Read the APK facts
        id: apk
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' android/app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          cp "$APK" "android/imgvault-android-$VERSION_NAME.apk"
          echo "path=android/imgvault-android-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk: $APK  version $VERSION_NAME ($VERSION_CODE)  $SIZE bytes  sha256 $SHA"

      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.apk.outputs.version_code }}
          name: ImgVault Android v${{ steps.apk.outputs.version_name }}
          body: |
            ImgVault for Android — v${{ steps.apk.outputs.version_name }} (versionCode ${{ steps.apk.outputs.version_code }})

            * sha256: `${{ steps.apk.outputs.sha256 }}`
            * size: ${{ steps.apk.outputs.size }} bytes

            Install the APK on the phone, allow "install unknown apps" for the
            browser/file manager, then open ImgVault. The app checks for
            updates on its own from the manifest at `/api/app-release`.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Update the update manifest
        env:
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE: ${{ steps.apk.outputs.size }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib

          manifest_path = pathlib.Path("web/src/data/android-release.json")
          old = json.loads(manifest_path.read_text(encoding="utf-8"))

          version_code = int(os.environ["VERSION_CODE"])
          published_code = int(old.get("versionCode") or 0)
          if version_code < published_code:
              raise SystemExit(
                  f"::error::the app's versionCode ({version_code}) is BELOW the published one "
                  f"({published_code}) - that would offer a downgrade. Bump versionCode in "
                  f"android/app/build.gradle.kts and push again."
              )

          # the floor is CARRIED OVER, never derived from the build being published
          floor = int(old.get("minSupportedVersionCode") or 0)
          if floor > version_code:
              raise SystemExit(
                  f"::error::minSupportedVersionCode ({floor}) is above the published build "
                  f"({version_code}) - that would lock every client out. Lower the floor in "
                  f"web/src/data/android-release.json and push again."
              )

          version_name = os.environ["VERSION_NAME"]
          new = {
              "app": "imgvault-android",
              "available": True,
              "downloadUrl": (
                  f"https://github.com/{os.environ['REPO']}/releases/download/"
                  f"android-v{version_code}/imgvault-android-{version_name}.apk"
              ),
              "minSupportedVersionCode": floor,
              "notes": f"ImgVault for Android {version_name}.",
              "sha256": os.environ["SHA256"],
              "sizeBytes": int(os.environ["SIZE"]),
              "versionCode": version_code,
              "versionName": version_name,
          }
          manifest_path.write_text(json.dumps(new, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(new, indent=2))
          PY

      - name: Commit the updated manifest
        run: |
          set -euo pipefail
          if git diff --quiet -- web/src/data/android-release.json; then
            echo "manifest unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/android-release.json
          git commit -m "android: publish v${{ steps.apk.outputs.version_name }} to the update manifest"
          git push origin HEAD:main
