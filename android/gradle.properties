org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# configuration cache stays OFF: the release signing config reads the
# keystore path/password/alias from environment variables, and the
# configuration cache reuses a stale signing config instead of re-reading
# them — that shipped an APK signed with the previous keystore (c22109fc)
# while the restored keystore was already the new one (bda52264).

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
